version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - nolintlint
    - sqlclosecheck
    - unconvert
    - wastedassign
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Ginkgo and Gomega are dot-imported by the specs that use them.
      - path: _test\.go
        text: "should not use dot imports"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/quadrubo/golib
